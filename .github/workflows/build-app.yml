name: Build APP

on:
  push:
    branches: [ "master", "old-android" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Android build components
        run: sdkmanager "platforms;android-33" "build-tools;30.0.3" "ndk;23.1.7779620" "cmake;3.22.1"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Apply ZeroTier Android patches
        run: bash scripts/prepare-core.sh

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: Zerotier-Fix-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: Zerotier-Fix-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign release APK
        if: github.event_name == 'push' && env.HAS_SIGNING_KEY == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '30.0.3'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && env.HAS_SIGNING_KEY == 'true'
        with:
          name: Zerotier-Fix-Release
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
